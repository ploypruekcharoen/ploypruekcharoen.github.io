{% include analytics.html %}

<script>
    (function () {
      function retargetExternalLinks(scope) {
        var currentOrigin = window.location.origin;
        // Target all external links, not just those in .page__content
        var links = (scope || document).querySelectorAll('a[href^="http"]');
    
        links.forEach(function (link) {
          try {
            var url = new URL(link.href, currentOrigin);
            if (url.origin !== currentOrigin) {
              link.setAttribute('target', '_blank');
    
              // preserve existing rel and add security flags
              var rel = (link.getAttribute('rel') || '').split(/\s+/);
              ['noopener','noreferrer','external'].forEach(function(flag){
                if (!rel.includes(flag)) rel.push(flag);
              });
              link.setAttribute('rel', rel.filter(Boolean).join(' ').trim());
            }
          } catch (e) {
            // ignore malformed URLs (mailto:, tel:, etc. aren't matched by ^http anyway)
          }
        });
      }
    
      // Initial run after DOM is ready
      document.addEventListener('DOMContentLoaded', function(){ retargetExternalLinks(document); });
    
      // In case of bfcache/nav restores
      window.addEventListener('pageshow', function(){ retargetExternalLinks(document); });
    })();
</script>

<script>
/* ==========================================================================
   Greedy Navigation
   ========================================================================== */

(function() {
  // Wait for jQuery to be available
  function waitForJQuery(callback) {
    if (typeof $ !== 'undefined') {
      callback();
    } else {
      setTimeout(function() {
        waitForJQuery(callback);
      }, 10);
    }
  }

  waitForJQuery(function() {
    var $nav = $('#site-nav');
    var $btn = $('#site-nav button');
    var $vlinks = $('#site-nav .visible-links');
    var $vlinks_persist_tail = $vlinks.children("*.persist.tail");
    var $hlinks = $('#site-nav .hidden-links');

    var breaks = [];

    function updateNav() {

      var availableSpace = $btn.hasClass('hidden') ? $nav.width() : $nav.width() - $btn.width() - 30;

      // The visible list is overflowing the nav
      if ($vlinks.width() > availableSpace) {

        while ($vlinks.width() > availableSpace && $vlinks.children("*:not(.persist)").length > 0) {
          // Record the width of the list
          breaks.push($vlinks.width());

          // Move item to the hidden list
          $vlinks.children("*:not(.persist)").last().prependTo($hlinks);

          availableSpace = $btn.hasClass("hidden") ? $nav.width() : $nav.width() - $btn.width() - 30;

          // Show the dropdown btn
          $btn.removeClass("hidden");
        }

        // The visible list is not overflowing
      } else {

        // There is space for another item in the nav
        while (breaks.length > 0 && availableSpace > breaks[breaks.length - 1]) {
          // Move the item to the visible list
          if ($vlinks_persist_tail.children().length > 0) {
            $hlinks.children().first().insertBefore($vlinks_persist_tail);
          } else {
            $hlinks.children().first().appendTo($vlinks);
          }
          breaks.pop();
        }

        // Hide the dropdown btn if hidden list is empty
        if (breaks.length < 1) {
          $btn.addClass('hidden');
          $btn.removeClass('close');
          $hlinks.addClass('hidden');
        }
      }

      // Keep counter updated
      $btn.attr("count", breaks.length);

      // update masthead height and the body/sidebar top padding
      var mastheadHeight = $('.masthead').height();
      $('body').css('padding-top', mastheadHeight + 'px');
      if ($(".author__urls-wrapper button").is(":visible")) {
        $(".sidebar").css("padding-top", "");
      } else {
        $(".sidebar").css("padding-top", mastheadHeight + "px");
      }

    }

    // Window listeners
    $(window).on('resize', function () {
      updateNav();
    });
    
    if (screen.orientation) {
      screen.orientation.addEventListener("change", function () {
        updateNav();
      });
    }

    $btn.on('click', function () {
      $hlinks.toggleClass('hidden');
      $(this).toggleClass('close');
    });

    // Initialize when DOM is ready
    $(document).ready(function() {
      updateNav();
    });
  });
})();
</script>
